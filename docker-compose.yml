services:
  db:
    image: mysql:8.0
    container_name: etudiants-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: etudiants
      MYSQL_USER: etudiants
      MYSQL_PASSWORD: etudiants
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    image: etudiants-app:1.0
    container_name: etudiants-app
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: etudiants
      DB_USER: etudiants
      DB_PASSWORD: etudiants
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
