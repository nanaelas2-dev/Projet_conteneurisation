apiVersion: apps/v1
kind: Deployment
metadata:
  name: etudiants-app
  labels:
    app: etudiants-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: etudiants-app
  template:
    metadata:
      labels:
        app: etudiants-app
    spec:
      containers:
        - name: etudiants-app
          image: etudiants-app:1.0
          imagePullPolicy: IfNotPresent   # image construite en local (minikube / kind / Docker Desktop)
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
          readinessProbe:            # le Pod ne reçoit du trafic que si MySQL répond
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:             # redémarre le conteneur s'il ne répond plus
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: etudiants-service
spec:
  type: NodePort
  selector:
    app: etudiants-app
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
